[project]
name = "greenness"
version = "0.1.0"
description = "Python reproduction of a Universal Kriging / functional-data pipeline for webcam-derived greenness curves"
authors = [{name = "Raziyeh Hosseini"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "openpyxl>=3.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
